<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Literacy Studio</title><style>*{box-sizing:border-box}body{margin:0;background:#fafaf6;color:#192c2b;font:16px system-ui}header{padding:12px 3vw;display:flex;flex-wrap:wrap;align-items:center;gap:12px}select,input,button{font:inherit;padding:8px;border:1px solid #839592;border-radius:6px}form{display:flex;flex:1;gap:6px}input{width:100%;min-width:180px}iframe{width:100%;height:80vh;border:0}#reply{margin:0 3vw 10px;font-size:14px}</style><header><label>Game <select id="game"></select></label><form id="chat"><input id="prompt" aria-label="Theme request" placeholder="Try a forest with a fox and a violet palette"><button>Apply</button></form></header><p id="reply" role="status"></p><iframe id="player" title="Game preview"></iframe><script>const templates={"dock": "<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>Orbit Patrol<\/title><style>*{box-sizing:border-box}body{background:#0a1122;color:#edf6ff;font:16px/1.5 system-ui;margin:0}main{width:min(1050px,94%);margin:24px auto}header{display:flex;align-items:center;justify-content:space-between;color:#a7f8cd;letter-spacing:.12em;font-weight:750}label{font:13px system-ui}select,button{color:inherit;background:#1b2a40;border:1px solid #435674;border-radius:8px;padding:10px 15px;cursor:pointer;font:inherit}h1{font-size:clamp(32px,6vw,64px);letter-spacing:-.06em;margin:18px 0}h1 span,small{color:#abf6cd}#port{height:clamp(190px,26vw,300px);border-radius:20px;overflow:hidden;position:relative;background:radial-gradient(circle at 2px 2px,#adaedc 1px,transparent 1.6px) 0 0/57px 43px,radial-gradient(ellipse at 35% 70%,#715478,#242a4e 55%,#0e1c33)}#port small{position:absolute;top:14px;left:18px;font:12px monospace}.planet{position:absolute;background:repeating-linear-gradient(13deg,#e1a09d 0 12px,#ffd1a9 14px 20px,#be899f 23px 30px);width:100px;height:100px;border-radius:50%;top:25%;left:16%;box-shadow:inset -15px -10px 20px #604166}.planet:after{content:'';position:absolute;inset:36% -32%;border:5px solid #e5c1a8;border-top-color:transparent;border-radius:50%;transform:rotate(-17deg)}.city{position:absolute;bottom:0;height:23%;width:100%;background:repeating-linear-gradient(110deg,#344258 0 50px,#526278 52px 54px);border-top:4px solid #7da9b6}.gate{position:absolute;right:12%;bottom:21%;width:23%;height:48%;border:13px solid #667e96;border-bottom:0;border-radius:24px 24px 0 0;box-shadow:inset 3px 2px 5px #78ffdb}.gate:before{content:'';position:absolute;inset:8% 10%;background:repeating-linear-gradient(0deg,transparent 0 9px,#90ffdd53 10px 11px)}#arrival{position:absolute;bottom:25%;left:42%;transition:left .75s ease}#port.scanning #arrival{left:70%}.sprite{width:60px;height:52px;display:inline-grid;place-items:center;vertical-align:middle;font:bold 21px monospace;color:#203649;background:radial-gradient(at 30% 12%,#d2ffcc,#69dbac 55%,#359299);border-radius:48%;filter:drop-shadow(0 6px 5px #142133)}.red{background:radial-gradient(at 30% 12%,#ffe2ae,#f58c85 55%,#aa5578)}.spiky{border-radius:0;clip-path:polygon(50% 0,61% 14%,78% 1%,79% 22%,100% 18%,89% 40%,100% 53%,88% 62%,99% 86%,74% 80%,71% 100%,53% 87%,33% 100%,29% 82%,4% 89%,14% 65%,0 55%,10% 39%,0 15%,24% 22%,26% 1%,40% 16%)}.mini{transform:scale(.78)}article{background:#19273c;padding:20px 24px;border-radius:15px;margin:14px 0}h2{margin:3px 0}p{color:#c6d3df}#cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:9px;margin-bottom:20px}.card{text-align:left}.card[aria-pressed=true]{background:#20423f;border-color:#89dbb8}.card b,.card small{display:block}.card[aria-pressed=true] b:before{content:'\u2713 '}.card small{font-size:12px}#actions button{margin-right:8px}#actions button:first-child{background:#aeffd3;color:#102824}button:focus-visible{outline:3px solid gold}@media(prefers-reduced-motion:reduce){#arrival{transition:none}}\n<\/style><main><header>\u25c8 ORBIT PATROL <label>Mission <select id=\"level\"><option>01 \u00b7 Literacy<\/option><option>02 \u00b7 Fluency<\/option><\/select><\/label><\/header><h1>Docking control<span>.<\/span><\/h1><section id=\"port\"><div class=\"planet\"><\/div><div class=\"city\"><\/div><div class=\"gate\"><\/div><small>\u25cf LIVE FEED / DOCK 07<\/small><div id=\"arrival\"><\/div><\/section><article><small id=\"phase\"><\/small><h2 id=\"title\"><\/h2><p id=\"msg\" aria-live=\"polite\"><\/p><div id=\"actions\"><\/div><\/article><section id=\"deck\"><h2>Training deck<\/h2><p>Round visitors are friendly. Spiky visitors are bugs. Select the labeled examples your gate will learn from.<\/p><div id=\"cards\"><\/div><\/section><button id=\"reset\">Restart mission<\/button><\/main><script>const samples=[{\n  \"archetype\": \"classifier_bias_lab\",\n  \"concept\": \"data_bias\",\n  \"level\": {\n    \"tier\": 1,\n    \"label\": \"literacy\"\n  },\n  \"theme\": {\n    \"setting\": \"A space station security gate\",\n    \"class_a\": \"friendly alien\",\n    \"class_b\": \"space bug\",\n    \"sprite_set\": \"aliens_bugs\"\n  },\n  \"features\": [\n    {\n      \"name\": \"color\",\n      \"values\": [\n        \"green\",\n        \"red\"\n      ],\n      \"role\": \"spurious\"\n    },\n    {\n      \"name\": \"shape\",\n      \"values\": [\n        \"round\",\n        \"spiky\"\n      ],\n      \"role\": \"true\"\n    }\n  ],\n  \"training_pool\": {\n    \"size\": 6,\n    \"bias_strength\": 1\n  },\n  \"curveballs\": [\n    {\n      \"id\": \"cb1\",\n      \"item\": {\n        \"color\": \"green\",\n        \"shape\": \"spiky\"\n      },\n      \"expected_model_failure\": true\n    }\n  ],\n  \"instructions\": \"Choose labeled training examples, then Train & Test. Inspect the predictions. Add counterexamples from the extra examples and retrain to help the gate generalize.\",\n  \"hints\": {\n    \"on_failure\": \"Your model used {learned_feature}. Add examples where {spurious_feature} disagrees with the class so it can learn {true_feature}.\",\n    \"on_success\": \"All tests passed. Your model used {learned_feature}. Explain why these examples helped.\"\n  },\n  \"ui\": {\n    \"show_confidence_meter\": false,\n    \"show_vocab_terms\": false\n  },\n  \"class_rule\": {\n    \"feature\": \"shape\",\n    \"class_a_value\": \"round\",\n    \"class_b_value\": \"spiky\"\n  }\n}\n,{\n  \"archetype\": \"classifier_bias_lab\",\n  \"concept\": \"data_bias\",\n  \"level\": {\n    \"tier\": 2,\n    \"label\": \"fluency\"\n  },\n  \"theme\": {\n    \"setting\": \"A space station security gate\",\n    \"class_a\": \"friendly alien\",\n    \"class_b\": \"space bug\",\n    \"sprite_set\": \"aliens_bugs\"\n  },\n  \"features\": [\n    {\n      \"name\": \"color\",\n      \"values\": [\n        \"green\",\n        \"red\"\n      ],\n      \"role\": \"spurious\"\n    },\n    {\n      \"name\": \"shape\",\n      \"values\": [\n        \"round\",\n        \"spiky\"\n      ],\n      \"role\": \"true\"\n    },\n    {\n      \"name\": \"size\",\n      \"values\": [\n        \"small\",\n        \"large\"\n      ],\n      \"role\": \"noise\"\n    }\n  ],\n  \"training_pool\": {\n    \"size\": 10,\n    \"bias_strength\": 0.8\n  },\n  \"curveballs\": [\n    {\n      \"id\": \"cb1\",\n      \"item\": {\n        \"color\": \"green\",\n        \"shape\": \"spiky\",\n        \"size\": \"small\"\n      },\n      \"expected_model_failure\": true\n    },\n    {\n      \"id\": \"cb2\",\n      \"item\": {\n        \"color\": \"red\",\n        \"shape\": \"round\",\n        \"size\": \"large\"\n      },\n      \"expected_model_failure\": true\n    },\n    {\n      \"id\": \"cb3\",\n      \"item\": {\n        \"color\": \"green\",\n        \"shape\": \"round\",\n        \"size\": \"large\"\n      },\n      \"expected_model_failure\": false\n    }\n  ],\n  \"instructions\": \"Choose labeled training examples, then Train & Test. Inspect the predictions. Add counterexamples from the extra examples and retrain to help the gate generalize.\",\n  \"hints\": {\n    \"on_failure\": \"Your model used {learned_feature}. Compare its training examples with the failed tests. Can you break the misleading {spurious_feature} pattern?\",\n    \"on_success\": \"All tests passed. Your model used {learned_feature}. Explain why these examples helped.\"\n  },\n  \"ui\": {\n    \"show_confidence_meter\": true,\n    \"show_vocab_terms\": true\n  },\n  \"class_rule\": {\n    \"feature\": \"shape\",\n    \"class_a_value\": \"round\",\n    \"class_b_value\": \"spiky\"\n  }\n}\n];<\/script><script>/* Pure, deterministic decision-stump simulation, shared by browser and Node tests. */\n(function (root) {\n  'use strict';\n  const role = (cfg, r) => cfg.features.find(f => f.role === r);\n  function label(cfg, item) {\n    const r = cfg.class_rule;\n    if (![r.class_a_value, r.class_b_value].includes(item[r.feature])) throw Error('Unknown class-defining value');\n    return item[r.feature] === r.class_a_value ? 'a' : 'b';\n  }\n  function makePool(cfg) {\n    const t = role(cfg, 'true'), s = role(cfg, 'spurious'), n = role(cfg, 'noise');\n    const size = cfg.training_pool.size;\n    const aligned = Math.round(size * cfg.training_pool.bias_strength);\n    const initial = Array.from({length: size}, (_, i) => {\n      const cls = i % 2;\n      const item = {[t.name]: cls ? cfg.class_rule.class_b_value : cfg.class_rule.class_a_value,\n        [s.name]: s.values[i < aligned ? cls : 1 - cls]};\n      if (n) item[n.name] = n.values[Math.floor(i / 2) % 2];\n      return {id: 'train-' + i, item, label: label(cfg, item), extra: false};\n    });\n    // Enumerate all combinations, ensuring a perfectly biased pool can always be repaired.\n    let combinations = [{}];\n    for (const f of cfg.features) combinations = combinations.flatMap(x => f.values.map(v => ({...x, [f.name]: v})));\n    const extra = combinations.map((item, i) => ({id: 'extra-' + i, item, label: label(cfg, item), extra: true}));\n    return {initial, extra, actualBias: aligned / size};\n  }\n  function train(cfg, rows) {\n    if (rows.length < 2 || new Set(rows.map(r => r.label)).size !== 2) throw Error('Choose examples from both classes before training.');\n    const candidates = cfg.features.map((f, order) => {\n      const mapping = {};\n      for (const v of f.values) {\n        const matching = rows.filter(r => r.item[f.name] === v);\n        const a = matching.filter(r => r.label === 'a').length;\n        mapping[v] = a >= matching.length - a ? 'a' : 'b';\n      }\n      const correct = rows.filter(r => mapping[r.item[f.name]] === r.label).length;\n      return {feature: f.name, mapping, accuracy: correct / rows.length,\n        priority: f.role === 'spurious' ? -1 : order};\n    });\n    // Deliberate shortcut preference on ties makes perfect correlations ambiguous.\n    candidates.sort((a,b) => b.accuracy - a.accuracy || a.priority - b.priority);\n    return candidates[0];\n  }\n  function evaluate(cfg, model) {\n    return cfg.curveballs.map(cb => {\n      const expected = label(cfg, cb.item), predicted = model.mapping[cb.item[model.feature]];\n      return {id: cb.id, item: cb.item, expected, predicted, passed: expected === predicted};\n    });\n  }\n  function hint(cfg, model, passed) {\n    const values = {true_feature: role(cfg,'true').name, spurious_feature: role(cfg,'spurious').name, learned_feature: model.feature};\n    return cfg.hints[passed ? 'on_success' : 'on_failure'].replace(/\\{(\\w+)\\}/g, (m,k) => values[k] ?? m);\n  }\n  const api = {label, makePool, train, evaluate, hint};\n  if (typeof module !== 'undefined' && module.exports) module.exports = api;\n  root.GameLogic = api;\n})(globalThis);\n<\/script><script>const el=id=>document.getElementById(id);\nlet cfg,pool,selected,reserves,model,tests,i,points,timer;\nfunction sprite(item){const s=document.createElement('span');s.className='sprite '+(item.color==='red'?'red ':'')+(item.shape==='spiky'?'spiky ':'')+(item.size==='small'?'mini':'');s.textContent='\u2022\u1d17\u2022';return s}\nfunction show(phase,title,msg){el('phase').textContent=phase;el('title').textContent=title;el('msg').textContent=msg;el('actions').replaceChildren();el('deck').hidden=phase!=='TRAIN'}\nfunction action(name,fn){const b=document.createElement('button');b.textContent=name;b.onclick=fn;el('actions').append(b)}\nfunction training(){show('TRAIN','Teach the gate',selected.size+' examples selected. '+(reserves?'Reserve specimens unlocked. Add examples that break the misleading pattern.':'Inspect the deck or train on the initial selection.'));action('Train gate \u2192',train);el('cards').replaceChildren();for(const row of [...pool.initial,...(reserves?pool.extra:[])]){const b=document.createElement('button');b.className='card';b.setAttribute('aria-pressed',selected.has(row.id));const name=document.createElement('b'),detail=document.createElement('small');name.textContent=cfg.theme['class_'+row.label];detail.textContent=Object.values(row.item).join(' \u00b7 ')+(row.extra?' \u00b7 reserve':'');b.append(sprite(row.item),name,detail);b.onclick=()=>{if(selected.has(row.id))selected.delete(row.id);else selected.add(row.id);training()};el('cards').append(b)}}\nfunction train(){try{model=GameLogic.train(cfg,[...pool.initial,...pool.extra].filter(r=>selected.has(r.id)))}catch(e){el('msg').textContent=e.message;return}tests=GameLogic.evaluate(cfg,model);i=points=0;predict()}\nfunction predict(){const r=tests[i];el('port').classList.remove('scanning');el('arrival').replaceChildren(sprite(r.item));show('ARRIVAL '+(i+1)+' / '+tests.length,'Predict the gate\u2019s decision',Object.values(r.item).join(' \u00b7 ')+'. Will the trained gate admit or divert this arrival?');for(const [key,text] of [['a','Admit'],['b','Divert']])action(text,()=>{el('port').classList.add('scanning');show('SCAN','Scanning arrival\u2026','Your prediction: '+text);timer=setTimeout(()=>{points+=Number(key===r.predicted);show('RESULT',r.passed?'Gate classified correctly':'Gate made a mistake',(key===r.predicted?'You predicted its decision. ':'Your prediction differed. ')+'The gate used '+model.feature+' and '+(r.predicted==='a'?'admitted':'diverted')+' a '+cfg.theme['class_'+r.expected]+'.');action(i+1<tests.length?'Next arrival':'Review mission',()=>{if(++i<tests.length)predict();else finish()})},800)})}\nfunction finish(){const n=tests.filter(r=>r.passed).length,win=n===tests.length;show('DEBRIEF',win?'Dock secured':'Retrain your gate',n+'/'+tests.length+' correct classifications \u00b7 '+points+'/'+tests.length+' decisions predicted. '+GameLogic.hint(cfg,model,win));if(win&&cfg.level.tier===1)action('Launch fluency mission',()=>{el('level').selectedIndex=1;loadActivity(samples[1])});action(win?'Replay':'Open reserves \u2192',()=>{if(win)loadActivity(cfg);else{reserves=true;el('port').classList.remove('scanning');training()}})}\nfunction loadActivity(config){clearTimeout(timer);cfg=config;pool=GameLogic.makePool(cfg);selected=new Set(pool.initial.map(r=>r.id));reserves=false;el('arrival').replaceChildren(sprite(pool.initial[0].item));el('port').classList.remove('scanning');training()}\nwindow.loadActivity=loadActivity;el('reset').onclick=()=>loadActivity(cfg);el('level').onchange=()=>loadActivity(samples[el('level').selectedIndex]);loadActivity(samples[0]);\n<\/script><\/html>\n", "arcade": "<!doctype html><html lang=\"en\"><meta charset=\"utf-8\"><meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"><title>AI Literacy Arcade<\/title><style>\n*{box-sizing:border-box}body{margin:0;background:#f3f4ee;color:#182d29;font:17px/1.55 system-ui}main{max-width:850px;margin:6vh auto;padding:20px}h1{font-size:clamp(34px,6vw,56px);line-height:1.04;letter-spacing:-.055em}h2{line-height:1.2}button,select{font:inherit;border:1px solid #56756b;background:white;color:inherit;border-radius:7px;padding:8px 13px;margin:4px;cursor:pointer}button:hover,button[aria-pressed=true]{background:#cce6d7}button:focus-visible,input:focus-visible{outline:3px solid #d27126}article{background:white;border:1px solid #c2d0c6;border-radius:12px;padding:22px;margin:16px 0}#menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}#menu button{text-align:left;padding:18px}button small{display:block;color:#45665a}input[type=range]{width:min(80%,360px);vertical-align:middle}label{display:block;margin:8px 0}output{font-weight:700;margin-left:8px}#feedback{background:#e0eddf;padding:14px;border-radius:8px}#feedback:empty,#nav:empty,article:empty{display:none}p{margin:10px 0}.line{position:relative;height:75px;border-bottom:2px solid #507160;margin:12px 20px 30px}.mark{position:absolute;bottom:0;transform:translateX(-50%);font:600 14px monospace;white-space:nowrap}.mark.target{bottom:30px;color:#903e20}button:disabled{opacity:.55}<\/style><main><nav id=\"nav\"><\/nav><h1 id=\"title\"><\/h1><p id=\"intro\"><\/p><div id=\"menu\"><\/div><article id=\"work\"><\/article><p id=\"feedback\" role=\"status\"><\/p><div id=\"next\"><\/div><\/main><script>const games=[\n  {\n    \"id\": \"neighbors\",\n    \"title\": \"Neighborhood Vote\",\n    \"tag\": \"Nearest neighbors\",\n    \"intro\": \"A sensor reading lands on the number line. Select the three closest labeled samples to see how a nearest-neighbor classifier predicts its label.\",\n    \"target\": 6,\n    \"points\": [\n      [\n        1,\n        \"A\"\n      ],\n      [\n        4,\n        \"B\"\n      ],\n      [\n        5,\n        \"A\"\n      ],\n      [\n        7,\n        \"B\"\n      ],\n      [\n        10,\n        \"A\"\n      ]\n    ]\n  },\n  {\n    \"id\": \"threshold\",\n    \"title\": \"Alert Dial\",\n    \"tag\": \"Decision thresholds\",\n    \"intro\": \"Choose a score cutoff for a spam filter. Block at least two spam messages while blocking zero real messages. Higher scores indicate more suspected spam.\",\n    \"records\": [\n      [\n        20,\n        0\n      ],\n      [\n        40,\n        1\n      ],\n      [\n        55,\n        0\n      ],\n      [\n        70,\n        1\n      ],\n      [\n        90,\n        1\n      ]\n    ],\n    \"minHits\": 2\n  },\n  {\n    \"id\": \"retrieval\",\n    \"title\": \"Search Desk\",\n    \"tag\": \"Retrieval & ranking\",\n    \"intro\": \"A learner needs one source for the deadline and another for the submission method. Rank the deadline source first and the submission source second.\",\n    \"docs\": [\n      [\n        \"Course calendar\",\n        \"Final project due Friday at noon.\"\n      ],\n      [\n        \"Project gallery\",\n        \"See examples from last year.\"\n      ],\n      [\n        \"Submission guide\",\n        \"Upload the report through the course portal.\"\n      ],\n      [\n        \"Welcome note\",\n        \"This course has a final project.\"\n      ]\n    ],\n    \"order\": [\n      0,\n      2\n    ]\n  },\n  {\n    \"id\": \"reward\",\n    \"title\": \"Reward Workshop\",\n    \"tag\": \"Reward design\",\n    \"intro\": \"A simulated robot always chooses the route with the highest points. Design rewards so the delivery route beats both waiting and repeatedly collecting tokens.\",\n    \"routes\": [\n      [\n        \"Wait\",\n        0,\n        0,\n        0\n      ],\n      [\n        \"Token loop\",\n        5,\n        0,\n        3\n      ],\n      [\n        \"Deliver\",\n        1,\n        1,\n        4\n      ]\n    ],\n    \"goal\": 2\n  },\n  {\n    \"id\": \"audit\",\n    \"title\": \"Claim Inspector\",\n    \"tag\": \"Grounding & uncertainty\",\n    \"intro\": \"Audit each sentence of an AI summary against the supplied evidence. A claim can be supported, contradicted, or left unresolved.\",\n    \"evidence\": \"A pilot tested a tutor with 20 volunteers. Average quiz scores rose from 60 to 68. There was no comparison group.\",\n    \"claims\": [\n      [\n        \"Twenty volunteers took part.\",\n        \"Supported\",\n        \"The sample size is stated directly.\"\n      ],\n      [\n        \"The researchers used a comparison group.\",\n        \"Contradicted\",\n        \"The report explicitly says there was none.\"\n      ],\n      [\n        \"The tutor caused the score increase.\",\n        \"Unresolved\",\n        \"The scores rose, but this study cannot isolate the cause.\"\n      ]\n    ]\n  }\n]\n;\nconst el=id=>document.getElementById(id);\nfunction node(parent,tag,text=''){const n=document.createElement(tag);n.textContent=text;parent.append(n);return n}\nfunction button(parent,text,fn){const b=node(parent,'button',text);b.onclick=fn;return b}\nlet current;\nfunction clear(){for(const id of ['nav','menu','work','feedback','next'])el(id).replaceChildren()}\nfunction home(){clear();el('title').textContent='AI literacy arcade';el('intro').textContent='Choose a short experiment.';for(const g of games){const b=button(el('menu'),g.title,()=>start(g));node(b,'small',g.tag)}}\nfunction start(g){clear();current=g;button(el('nav'),'\u2190 Arcade',home);el('title').textContent=g.title;el('intro').textContent=g.intro;builders[g.id](g,el('work'))}\nfunction finish(message){el('feedback').textContent='Complete. '+message;for(const n of el('work').querySelectorAll('button,input'))n.disabled=true;button(el('next'),'Play again',()=>start(current));button(el('next'),'Choose another game',home)}\nfunction range(parent,name,min,max,start,onChange,step=1){const label=node(parent,'label',name+' '),input=node(label,'input');input.type='range';Object.assign(input,{min,max,step,value:start});const out=node(label,'output',String(start));input.oninput=()=>{out.value=input.value;el('feedback').textContent='';onChange()};return input}\nfunction neighbors(g,w){const picked=new Set(),line=node(w,'div');line.className='line';const vals=[g.target,...g.points.map(p=>p[0])],lo=Math.min(...vals),hi=Math.max(...vals);\n function mark(x,s,target=false){const m=node(line,'span',s);m.className='mark'+(target?' target':'');m.style.left=(100*(x-lo)/(hi-lo||1))+'%'}\n mark(g.target,'\u2193 '+g.target,true);for(const [x,label] of g.points)mark(x,x+label);\n const nearest=g.points.map(([x],i)=>i).sort((a,b)=>Math.abs(g.points[a][0]-g.target)-Math.abs(g.points[b][0]-g.target)).slice(0,3);\n for(const [i,[x,label]] of g.points.entries()){const b=button(w,x+' \u00b7 '+label,()=>{if(picked.has(i))picked.delete(i);else picked.add(i);b.setAttribute('aria-pressed',picked.has(i));el('feedback').textContent=picked.size+' selected'});b.setAttribute('aria-pressed',false)}\n button(w,'Count votes',()=>{if(picked.size!==3||nearest.some(i=>!picked.has(i))){el('feedback').textContent='Compare each distance to '+g.target+'. Choose the three smallest distances.';return}const votes={};for(const i of nearest){const label=g.points[i][1];votes[label]=(votes[label]||0)+1}const winner=Object.keys(votes).sort((a,b)=>votes[b]-votes[a])[0];finish('Class '+winner+' wins with '+votes[winner]+' of 3 votes.')})}\nfunction threshold(g,w){let dial;const report=node(w,'p');node(w,'p',g.records.map(([s,y])=>s+' = '+(y?'spam':'real')).join('  \u00b7  '));function score(){const flagged=g.records.filter(([s])=>s>=Number(dial.value));return [flagged.filter(r=>r[1]).length,flagged.filter(r=>!r[1]).length]}function update(){const [hit,falseAlarm]=score();report.textContent=hit+' spam blocked \u00b7 '+falseAlarm+' real messages blocked'}dial=range(w,'Block scores at or above',0,100,30,update,5);update();button(w,'Apply cutoff',()=>{const [hit,fp]=score();if(hit>=g.minHits&&!fp)finish('This cutoff meets both goals. Lowering it can catch more spam at the cost of blocking real messages.');else el('feedback').textContent=fp?'A real message was blocked. Raise the cutoff.':'Too much spam got through. Lower the cutoff.'})}\nfunction retrieval(g,w){let chosen=[];const rank=node(w,'p');const options=g.docs.map(([title,body],i)=>button(w,title+' \u2014 '+body,()=>{chosen.push(i);refresh()}));function refresh(){rank.textContent='Ranking: '+(chosen.map(i=>g.docs[i][0]).join(' \u2192 ')||'empty');options.forEach((b,i)=>b.disabled=chosen.includes(i)||chosen.length===g.order.length);el('feedback').textContent=''}refresh();button(w,'Undo last',()=>{chosen.pop();refresh()});button(w,'Check ranking',()=>{if(chosen.length===g.order.length&&chosen.every((v,i)=>v===g.order[i]))finish('The first source answers when. The second answers how. Keyword overlap alone didn\u2019t answer either question.');else el('feedback').textContent='Read the passages. Which one actually states the deadline? Which gives submission instructions?'})}\nfunction reward(g,w){let token,delivery,cost;const scores=node(w,'p');function values(){return g.routes.map(([,t,d,s])=>t*token.value+d*delivery.value-s*cost.value)}function update(){scores.textContent=values().map((v,i)=>g.routes[i][0]+': '+v).join('  \u00b7  ')}node(w,'p',g.routes.map(([name,t,d,s])=>name+' = '+t+' tokens, '+d+' deliveries, '+s+' steps').join(' | '));token=range(w,'Points per token',0,5,3,update);delivery=range(w,'Points per delivery',0,15,2,update);cost=range(w,'Cost per step',0,3,1,update);update();button(w,'Run robot',()=>{const vs=values(),best=Math.max(...vs),winners=g.routes.filter((_,i)=>vs[i]===best);if(winners.length===1&&vs[g.goal]===best)finish('The robot chose '+g.routes[g.goal][0]+'. The points now favor the intended behavior.');else el('feedback').textContent='Highest scoring: '+winners.map(r=>r[0]).join(' and ')+'. Make delivery strictly more valuable.'})}\nfunction audit(g,w){node(w,'blockquote',g.evidence);const q=node(w,'h2'),choices=node(w,'div');let i=0;function turn(){q.textContent=g.claims[i][0];choices.replaceChildren();for(const label of ['Supported','Contradicted','Unresolved'])button(choices,label,()=>{const [,answer,why]=g.claims[i];if(label!==answer){el('feedback').textContent='Try again. '+why;return}if(++i===g.claims.length){finish(why);return}el('feedback').textContent='Correct. '+why;turn()})}turn()}\nconst builders={neighbors,threshold,retrieval,reward,audit};home();\n<\/script><\/html>\n"};
// Shared allowlisted cosmetics. Website chat calls applyGameTheme with a partial patch.
const catalog = {
  environment: {space:['Orbital station','✦','☾','#1c2546','#655783'],ocean:['Deep-sea observatory','≈','🪸','#15495f','#287b80'],forest:['Woodland outpost','♠','🌲','#244937','#617745'],city:['Night city','▥','🏙️','#32234a','#745185']},
  character: {astronaut:'🧑‍🚀',robot:'🤖',fox:'🦊',diver:'🤿',cat:'🐈',owl:'🦉'},
  palette: {mint:['#eaf5ef','#15382e','#176048'],violet:['#f0ebfa','#30233e','#69368c'],amber:['#fff3d9','#403116','#85521a'],blue:['#e8f1ff','#182c47','#285e95']}
};
let theme={environment:'space',character:'astronaut',palette:'mint'};
const player=document.getElementById('player');
function applyGameTheme(patch){
  if(!patch || typeof patch!=='object'||Array.isArray(patch))throw Error('Expected a theme object.');
  for(const [key,value] of Object.entries(patch))if(!Object.hasOwn(catalog,key)||typeof value!=='string'||!Object.hasOwn(catalog[key],value))throw Error('Unsupported theme option: '+key);
  theme={...theme,...patch};paint(player.contentDocument);return {...theme};
}
window.applyGameTheme=applyGameTheme;
window.getGameThemeOptions=()=>Object.fromEntries(Object.entries(catalog).map(([k,v])=>[k,Object.keys(v)]));
function paint(doc){
  if(!doc?.body)return;
  const [paper,ink,accent]=catalog.palette[theme.palette];
  const [place,pattern,landmark,sky,ground]=catalog.environment[theme.environment];
  const actor=catalog.character[theme.character];
  for(const [key,value] of Object.entries({paper,ink,accent,sky,ground}))doc.documentElement.style.setProperty('--'+key,value);
  let scene=doc.getElementById('theme-scene');
  if(!scene){
    const css=doc.createElement('style');css.textContent=themeCSS;doc.head.append(css);
    scene=doc.createElement('div');scene.id='theme-scene';doc.body.prepend(scene);
  }
  scene.textContent=actor+'   '+theme.character.toUpperCase()+'   /   '+place+'     '+landmark+'  '+pattern;
  doc.body.dataset.environment=theme.environment;
  doc.documentElement.style.setProperty('--actor',JSON.stringify(actor));
  doc.documentElement.style.setProperty('--landmark',JSON.stringify(landmark+'   '+pattern+'   '+landmark));
  const feed=doc.querySelector('#port small');if(feed)feed.textContent='● LIVE FEED / '+place.toUpperCase();
  const header=doc.querySelector('header');if(header)header.style.color='var(--ink)';
}
const themeCSS=`
body{background:var(--paper);color:var(--ink)}
#theme-scene{background:linear-gradient(120deg,var(--sky),var(--ground));color:white;font:700 14px system-ui;letter-spacing:.06em;padding:20px max(4vw,20px);border-bottom:4px solid var(--accent)}
article,#feedback{background:white;color:var(--ink);border:1px solid var(--accent)}
button,select,.card{color:var(--ink);background:white;border-color:var(--accent)}
button:hover,button[aria-pressed=true],#actions button:first-child{background:var(--accent);color:white}
small,button small,.card small,p,h1 span{color:var(--ink)}
button[aria-pressed=true] small{color:white}input{accent-color:var(--accent)}
#port{background:radial-gradient(circle at 2px 2px,#ffffff55 1px,transparent 2px) 0 0/53px 47px,linear-gradient(165deg,var(--sky),var(--ground))}
#port small{color:white}
body:not([data-environment=space]) .planet{background:none;box-shadow:none;width:auto;height:auto;border:0;font:54px system-ui}
body:not([data-environment=space]) .planet:after{content:var(--landmark);position:static;display:block;transform:none;border:0}
.sprite:after{content:var(--actor);position:absolute;font:12px system-ui;bottom:4px;left:40%}.sprite{position:relative}
`;

const titles={dock:'Orbit Patrol',neighbors:'Neighborhood Vote',threshold:'Alert Dial',retrieval:'Search Desk',reward:'Reward Workshop',audit:'Claim Inspector'};
const game=document.getElementById('game');
for(const [id,title] of Object.entries(titles))game.add(new Option(title,id));
function launch(){const id=game.value;player.onload=()=>paint(player.contentDocument);let html=templates.dock;if(id!=='dock')html=templates.arcade.replace('};home();','};start(games.find(g=>g.id==='+JSON.stringify(id)+'));').replace('<nav id="nav">','<nav hidden id="nav">');player.srcdoc=html}
game.onchange=launch;launch();
const aliases={purple:'violet',green:'mint',orange:'amber',underwater:'ocean',woodland:'forest',urban:'city',cosmic:'space',robots:'robot',cats:'cat',foxes:'fox'};
document.getElementById('chat').onsubmit=e=>{
 e.preventDefault();const patch={};
 for(const word of document.getElementById('prompt').value.toLowerCase().match(/[a-z]+/g)||[]){
 const term=aliases[word]||word;for(const [k,v] of Object.entries(catalog))if(Object.hasOwn(v,term))patch[k]=term}
 const reply=document.getElementById('reply');
 if(Object.keys(patch).length){applyGameTheme(patch);reply.textContent='Applied '+Object.values(patch).join(', ')+'.'}
 else reply.textContent='Available choices: '+Object.values(window.getGameThemeOptions()).map(v=>v.join(', ')).join(' / ')+'.';
};
