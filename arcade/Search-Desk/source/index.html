<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Search-Desk</title><link rel="stylesheet" href="style.css"></head>
<body><main class="arena-stage"><canvas id="arena" tabindex="0" width="560" height="245" aria-label="Playable arena"></canvas>
<header class="telemetry"><div><strong id="title"></strong><span id="phase"></span></div><div class="scores"><b id="team0"></b><b id="team1"></b></div><span id="metric"></span><div id="meter"></div></header>
<section class="task"><strong id="subject"></strong><span id="detail"></span><div id="sources"></div><label id="dial" hidden>Cutoff <input id="slider" type="range" min="0"></label></section>
<output id="callout" aria-live="polite"></output>
<aside id="guide" hidden aria-label="Narrator"><strong>GUIDE</strong><p id="instruction" aria-live="polite"></p><div><button id="continue">NEXT &gt;&gt;</button><button id="skip">Skip</button></div></aside>
<nav class="keycaps" aria-label="Game controls"><div id="actions"></div><button id="help">[?] Guide</button></nav></main>
<script src="../../shuffle.js"></script><script src="game_logic.js"></script><script src="../../environment.js"></script><script src="sprites.js"></script><script src="../../field_cases.js"></script><script src="game.js"></script><script src="../../animation.js"></script><script src="../../narrator.js"></script><script src="../../arcade_hud.js"></script></body></html>
