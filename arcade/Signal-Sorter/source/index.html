<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Signal-Sorter</title><link rel="stylesheet" href="style.css"></head>
<body><main class="arena-stage"><section class="playfield" aria-label="Arena"><canvas id="arena" tabindex="0" width="560" height="245" aria-label="Playable arena. Move with WASD or arrow keys. Press E or Space beside conduit hardware to switch its state."></canvas>
<header class="telemetry"><strong id="title"></strong><span id="metric"></span><div><span id="core0"></span><progress id="buffer0" aria-label="Core buffer"></progress><progress id="heat0" max="5" aria-label="Core heat"></progress></div><div><span id="core1"></span><progress id="buffer1" aria-label="Core buffer"></progress><progress id="heat1" max="5" aria-label="Core heat"></progress></div></header></section>
<section class="console" aria-label="Routing console">
  <section class="task"><h2 id="next0">Next 1</h2><canvas id="wave0" width="100" height="24" aria-hidden="true"></canvas></section>
  <section class="task"><h2 id="next1">Next 2</h2><canvas id="wave1" width="100" height="24" aria-hidden="true"></canvas></section>
  <nav class="keycaps" aria-label="Routing controls"><h2 id="progress"></h2><p id="objective"></p><p id="detail"></p>
    <output id="callout" aria-live="polite"></output><button id="help">[?] Guide</button>
    <aside id="guide" hidden><p id="instruction" aria-live="polite"></p><button id="continue">Next</button><button id="skip">Skip</button></aside>
  </nav>
</section>
</main>
<script src="../../shuffle.js"></script><script src="game_logic.js"></script><script src="../../tutorial.js"></script><script src="../../environment.js"></script><script src="sprites.js"></script><script src="../../field_cases.js"></script><script src="game.js"></script><script src="../../world_engine.js"></script><script src="../../world.js"></script><script src="../../animation.js"></script><script src="../../narrator.js"></script><script src="../../arcade_hud.js"></script></body></html>
