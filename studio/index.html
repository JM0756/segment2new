<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Studio</title><link rel="stylesheet" href="/studio/style.css">
<header><span class="logo">▦</span> Arcade Studio</header><main><section><div class="line"><h1>Live stage</h1><div id="levels"></div></div><iframe title="Playable activity" id="stage"></iframe><h2>Activity library</h2><div id="catalog"></div></section><aside><nav><button id="genTab">Generate</button><button id="chatTab">Chat remix</button></nav><form id="generate"><label>Archetype<select id="game"></select></label><label>Curriculum topic<input id="topic" required placeholder="Spurious correlations"></label><label>Narrative theme<input id="theme" required placeholder="Midnight street market"></label><label>Difficulty<select id="difficulty"><option>Level 1</option><option>Level 1 + Level 2</option></select></label><label class="check"><input type="checkbox" id="sprites"> Generate 2D sprites</label><button class="primary">Generate activity</button></form><form id="chat" hidden><div id="history" aria-live="polite"></div><label>Remix the loaded activity<textarea required id="message" placeholder="Describe your changes"></textarea></label><button class="primary">Apply remix</button></form><output id="status" aria-live="polite"></output></aside></main><script src="/studio/app.js"></script></html>
