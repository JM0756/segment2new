<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Arcade Studio</title><link rel="stylesheet" href="/studio/style.css"></head>
<body><a class="skip" href="#main">Skip to main content</a>
<header><div class="brand"><span class="mark" aria-hidden="true">✜</span> Arcade Studio <small id="model">FreeLLMAPI</small></div>
<button id="back" aria-label="Start a new session" hidden>← New Session</button>
<div class="controls"><div class="segmented" role="group" aria-label="Color theme">
<button id="mode-dark" aria-label="Dark theme" title="Dark theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20.6 14A9 9 0 0 1 10 3.4 9 9 0 1 0 20.6 14Z"/></svg></button><button id="mode-light" aria-label="Light theme" title="Light theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg></button><button id="mode-invert" aria-label="High contrast theme" title="High contrast theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18Z" fill="currentColor" stroke="none"/></svg></button></div>
<button id="savedToggle" aria-label="Open saved games" aria-haspopup="dialog">Saved games</button></div></header>
<main id="main" tabindex="-1"><section id="home"><div class="hero"><canvas id="mascot" width="29" height="24" aria-hidden="true"></canvas><h1>Press start on any idea.</h1><p>Build interactive ML arcade games — worlds, rules, and sprites.</p></div>
<h2>Explore games</h2><div id="catalog"></div></section>
<section hidden id="thread" role="log" aria-label="Studio conversation" aria-live="polite" aria-relevant="additions text"></section>
<div id="dock" class="composer-dock"><form id="composer" class="composer"><textarea id="theme" rows="1" required aria-label="Message to Arcade Studio" placeholder="Describe the setting or game you want to build…"></textarea><div class="tools"><select id="game" aria-label="Game archetype"></select><label><input id="sprites" type="checkbox"> 2D Sprites</label><button class="send" id="send" aria-label="Send message">↑</button></div></form></div>
<div id="play" class="stage-fullscreen-root" hidden>
<iframe id="stage" title="Playable activity" allowfullscreen></iframe>
<form id="stageChat" hidden><label for="remixText">Remix this game</label><textarea id="remixText" required rows="2" placeholder="Describe a change…"></textarea><button type="submit">Apply remix</button></form>
<div class="stage-controls"><button id="resumeLevel" hidden>Resume level</button><button id="saveProgress" aria-label="Save progress" title="Save progress"><svg viewBox="0 0 20 20" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 3h11l3 3v11H3zM6 3v5h7V3M6 17v-6h8v6"/></svg><svg class="saved-check" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.3" aria-hidden="true"><path d="m3 10 4.5 4.5L17 5"/></svg></button><button hidden id="remixToggle" aria-label="Remix this game" aria-controls="stageChat" aria-expanded="false"><canvas id="remixMascot" width="29" height="24" aria-hidden="true"></canvas></button>
<button id="fullscreen" aria-label="Enter fullscreen" aria-pressed="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path class="expand" d="M9 3H3v6m0-6 6 6m6-6h6v6m0-6-6 6M3 15v6h6m-6 0 6-6m12 0v6h-6m6 0-6-6"/><path class="collapse" d="M3 9h6V3m0 6L3 3m12 0v6h6m-6 0 6-6M3 15h6v6m0-6-6 6m12 0v-6h6m-6 0 6 6"/></svg></button></div></div>
<output id="status" aria-live="polite"></output></main>
<dialog id="saved" aria-labelledby="savedTitle"><div class="line"><h2 id="savedTitle">All Saved Games</h2><button id="close" aria-label="Close saved games">×</button></div><div id="savedList"></div></dialog>
<script src="/arcade/environment.js"></script><script src="/studio/progression.js"></script><script src="/studio/app.js"></script></body></html>
